[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recon-local"
version = "0.1.0"
description = "Local static binary analysis and reproducible function similarity"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2", "capstone>=5.0.3,<6", "fastapi>=0.115,<1",
  "lief>=0.17,<3", "networkx>=3.4,<4", "numpy>=2.1,<3",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.6,<2", "sqlalchemy>=2.0.38,<3", "uvicorn>=0.34,<1", "pyelftools>=0.32,<1",
]

[project.optional-dependencies]
research = ["torch>=2.6,<3", "safetensors>=0.5,<1", "faiss-cpu>=1.10,<2"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-networkx>=3.4", "ziglang>=0.14,<0.16"]

[project.scripts]
recon = "recon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["backend/recon"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["capstone.*", "lief.*", "sklearn.*", "faiss.*"]
ignore_missing_imports = true
