name: tests and reproducibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra research
      - run: uv run --no-sync ruff check backend scripts tests
      - run: uv run --no-sync ruff format --check backend scripts tests
      - run: uv run --no-sync mypy backend/recon
      - run: uv run --no-sync pytest -q
      - name: Build actual GCC and Clang source matrix
        if: runner.os == 'Linux'
        run: uv run --no-sync recon dataset build
      - name: Audit dataset split isolation
        if: runner.os == 'Linux'
        run: uv run --no-sync recon dataset audit
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec prettier --check src e2e vite.config.ts playwright.config.ts
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
